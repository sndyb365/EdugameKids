<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Dashboard Guru - EduGameKids</title><link rel="stylesheet" href="style.css"><style>
.dash{min-height:100dvh;padding:18px}.dash-wrap{width:min(1280px,100%);margin:auto}.dash-card{background:var(--paper);border:4px solid rgba(255,255,255,.78);box-shadow:var(--shadow);border-radius:34px;padding:20px;margin:14px 0}.dash-head{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.dash-head h1{font-size:clamp(28px,4vw,54px);line-height:.95}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.summary>div{border-radius:28px;padding:18px;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,255,255,.48));border:3px solid var(--line);position:relative;overflow:hidden}.summary b{display:block;font-size:42px;color:var(--ink)}.summary span{font-weight:900;color:var(--muted)}.filters{display:flex;gap:10px;flex-wrap:wrap}.filters input,.filters select{border:3px solid var(--line);border-radius:18px;padding:13px 15px;font-weight:900;background:#fff;color:var(--ink)}.table-wrap{overflow:auto}.dash-table{width:100%;border-collapse:separate;border-spacing:0 10px;min-width:980px}.dash-table th{text-align:left;color:var(--muted);font-size:13px;padding:0 12px}.dash-table td{background:rgba(255,255,255,.76);padding:14px 12px;border-top:2px solid var(--line);border-bottom:2px solid var(--line);font-weight:900;vertical-align:top}.dash-table td:first-child{border-left:2px solid var(--line);border-radius:18px 0 0 18px}.dash-table td:last-child{border-right:2px solid var(--line);border-radius:0 18px 18px 0}.badge{display:inline-flex;border-radius:99px;padding:7px 10px;background:#fff;border:2px solid var(--line);font-size:12px}.empty{text-align:center;padding:54px;font-weight:1000;color:var(--muted)}.obs-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}.obs-grid label{background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px;font-size:12px;font-weight:900}.obs-grid input{width:100%;margin-top:4px}.detail{max-width:320px;color:var(--muted);font-size:12px}@media(max-width:800px){.summary{grid-template-columns:repeat(2,1fr)}.dash-card{padding:14px}.filters input,.filters select{width:100%}.obs-grid{grid-template-columns:1fr}.theme-btn{top:auto;bottom:16px;right:16px}}@media(max-width:460px){.summary{grid-template-columns:1fr}.head-actions{width:100%}.head-actions .pill-btn{flex:1;justify-content:center}}
</style></head><body><div class="deco"></div><button id="themeBtn" class="theme-btn">🌙</button><main class="dash"><div class="dash-wrap"><header class="dash-card dash-head"><div><p class="eyebrow">📋 Dashboard Guru</p><h1>Monitor Hasil Siswa</h1><p class="subtext">Hotspot dihitung sebagai kelengkapan. Coretan/garis dinilai lewat observasi guru.</p></div><div class="head-actions"><a class="pill-btn cream" href="index.html">🎮 Game</a><a class="pill-btn teacher" href="editor.html">🛠️ Editor</a><button id="exportCsv" class="pill-btn score-btn">⬇️ CSV</button><button id="clearBtn" class="pill-btn">🗑️ Reset</button></div></header><section class="dash-card summary" id="summary"></section><section class="dash-card"><div class="filters"><input id="q" placeholder="🔍 Cari nama / kelas..."><select id="aspect"><option value="">Semua aspek</option><option value="afektif">Afektif</option><option value="kognitif">Kognitif</option><option value="psikomotorik">Psikomotorik</option></select><select id="sort"><option value="new">Terbaru</option><option value="score">Skor tertinggi</option><option value="name">Nama A-Z</option></select></div></section><section class="dash-card table-wrap" id="table"></section></div></main><script>
const $=q=>document.querySelector(q);function load(){try{return JSON.parse(localStorage.getItem('egk_results')||'[]')}catch{return[]}}function save(a){localStorage.setItem('egk_results',JSON.stringify(a))}function esc(s=''){return String(s).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function filtered(){let d=load();const q=$('#q').value.toLowerCase().trim(), a=$('#aspect').value; if(q)d=d.filter(r=>JSON.stringify(r.identity||{}).toLowerCase().includes(q)); if(a)d=d.filter(r=>r.aspect===a); if($('#sort').value==='score')d.sort((x,y)=>(Number(y.finalScore)||0)-(Number(x.finalScore)||0)); else if($('#sort').value==='name')d.sort((x,y)=>(x.identity?.name||'').localeCompare(y.identity?.name||'')); else d=d.reverse(); return d}
function render(){const all=load(), d=filtered(), scored=all.filter(x=>x.finalScore!==null&&x.finalScore!==undefined), avg=scored.length?Math.round(scored.reduce((s,x)=>s+(Number(x.finalScore)||0),0)/scored.length):0;const uniq=new Set(all.map(x=>(x.identity?.name||'')+'-'+(x.identity?.number||''))).size;$('#summary').innerHTML=`<div><b>${uniq}</b><span>Jumlah siswa</span></div><div><b>${all.length}</b><span>Submission</span></div><div><b>${avg}</b><span>Rata-rata skor</span></div><div><b>${all.filter(x=>x.status?.includes('manual')).length}</b><span>Observasi manual</span></div>`;$('#table').innerHTML=d.length?`<table class="dash-table"><thead><tr><th>Siswa</th><th>Aspek</th><th>Progress</th><th>Skor</th><th>Observasi Guru</th><th>Status</th><th>Waktu</th></tr></thead><tbody>${d.map((r,i)=>`<tr><td><b>${esc(r.identity?.name)}</b><br><small>Absen ${esc(r.identity?.number)} • ${esc(r.identity?.kelas)}</small></td><td><span class="badge">${esc(r.aspectTitle||r.aspect)}</span></td><td>${r.completion?.filled??0}/${r.completion?.total??0}<br><small>${r.completion?.score??'-'}%</small></td><td><b style="font-size:24px">${r.finalScore??'—'}</b><br><small>${r.manualScore!==null&&r.manualScore!==undefined?'Manual':'Auto'}</small></td><td><div class="detail">Nilai coretan/garis dari bukti kerja siswa.</div><div class="obs-grid">${['Fokus','Kerapian','Kreativitas','Mandiri','Ketepatan'].map(n=>`<label>${n}<input min="0" max="5" value="${(r.observasi&&r.observasi[n])||''}" data-id="${r.id}" data-k="${n}" type="number"></label>`).join('')}</div></td><td>${esc(r.status)}</td><td>${esc(r.time)}</td></tr>`).join('')}</tbody></table>`:`<div class="empty">Belum ada hasil. Siswa perlu klik tombol ✅ Selesai dulu.</div>`;document.querySelectorAll('.obs-grid input').forEach(inp=>inp.onchange=()=>{const arr=load(), row=arr.find(x=>x.id===inp.dataset.id); if(row){row.observasi=row.observasi||{};row.observasi[inp.dataset.k]=inp.value;save(arr)}})}
function csv(){const rows=[['Nama','Absen','Kelas','Aspek','Progress','Skor','Manual','Status','Waktu']].concat(load().map(r=>[r.identity?.name,r.identity?.number,r.identity?.kelas,r.aspectTitle,r.completion?.score,r.finalScore,r.manualScore,r.status,r.time]));const txt=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv'}));a.download='dashboard-edugamekids.csv';a.click()}
function applyTheme(){const d=localStorage.getItem('egk_theme')==='dark';document.body.classList.toggle('dark',d);$('#themeBtn').textContent=d?'☀️':'🌙'}$('#themeBtn').onclick=()=>{localStorage.setItem('egk_theme',document.body.classList.contains('dark')?'light':'dark');applyTheme()};['q','aspect','sort'].forEach(id=>$('#'+id).oninput=render);$('#exportCsv').onclick=csv;$('#clearBtn').onclick=()=>{if(confirm('Hapus semua hasil siswa?')){save([]);render()}};applyTheme();render();
</script></body></html>
