</head><body><button id="themeBtn" class="theme-btn">🌙</button><main class="editor"><div class="editor-wrap"><header class="editor-head"><div><p class="eyebrow">🛠️ Editor Universal</p><h1 id="title">Hotspot 3 Aspek</h1><p class="subtext" id="subtitle">Pilih aspek, edit hotspot, lalu simpan.</p></div><div class="quick-links"><a class="pill-btn cream" href="index.html">🎮 Game</a><a class="pill-btn teacher" href="dashboard.html">📋 Dashboard</a></div></header><section class="editor-panel"><div class="aspect-tabs" id="aspectTabs"></div></section><section class="editor-panel controls"><span class="status-badge" id="pageBadge">Halaman 1/26</span><button id="prev" class="pill-btn">← Prev</button><input id="page" type="number" min="1" value="1"><button id="next" class="pill-btn">Next →</button><button id="save" class="pill-btn finish-btn">💾 Simpan</button><button id="export" class="pill-btn score-btn">⬇️ Export Data</button><button id="rapikanDragBtn" class="pill-btn teacher" type="button">🧲 Rapikan Drag</button>
<button id="exportAssetsBtn" type="button">📦 Export Assets</button><button id="reset" class="pill-btn">↩️ Reset</button><span class="hintline" id="status">Siap edit</span></section><section class="editor-main"><aside class="editor-panel toolbox"><div class="mini-title">Tambah Hotspot</div><div class="toolgrid"><button data-add="mark" class="pill-btn">☑️ Check</button><button data-add="truefalse" class="pill-btn teacher">✅✖ Benar/Salah</button><button data-add="text" class="pill-btn">⌨️ Text</button><button data-add="circle" class="pill-btn">⭕ Circle</button><button data-add="connect" class="pill-btn">🔗 Connect</button><button data-add="dragitem" class="pill-btn">🧩 Drag Item dari Slide</button><button data-add="imageLocal" class="pill-btn score-btn">🖼️ Drag Item dari Local</button><button data-add="dropzone" class="pill-btn">🎯 Drop Zone</button><button data-add="maze" class="pill-btn">🧭 Maze / Path Point</button><button id="addMazePathPoint" class="pill-btn score-btn" type="button">➕ Path Point</button><button data-add="trace" class="pill-btn">✍️ Trace</button><button data-add="coloring" class="pill-btn">🎨 Coloring</button><button data-add="colorzone" class="pill-btn score-btn">🌈 Color Zones</button><button data-add="hint" class="pill-btn">💬 Hint</button><button id="del" class="pill-btn">🗑️ Hapus</button><input id="imageLocalInput" type="file" accept="image/*" style="display:none"></div><p class="hintline" style="margin-top:14px">Editor ini sudah beneran 3 aspek. Klik tab Afektif/Kognitif/Psikomotorik di atas.</p></aside><div class="canvas-wrap"><div id="stage" class="edit-stage"><img id="slide" draggable="false"><div id="layer" class="ed-layer"></div></div></div><aside class="editor-panel propbox"><div class="mini-title">Properti Selected</div><div id="props" class="hintline">Klik hotspot dulu.</div><label>Data slide saat ini</label><textarea id="json" class="jsonbox"></textarea><button id="applyJson" class="pill-btn teacher" style="margin-top:8px">Terapkan JSON Slide</button></aside></section></div></main><script src="data.js"></script><script>
const $=q=>document.querySelector(q), layer=$('#layer');let DATA=structuredClone(window.ASPEK_DATA||ASPEK_DATA), aspect=new URLSearchParams(location.search).get('aspect')||'afektif', page=1, selected=null, drag=null, keyEditMode=false;if(!DATA[aspect])aspect='afektif';try{const s=JSON.parse(localStorage.getItem('egk_editor_data')||'null'); if(s) Object.keys(s).forEach(k=>{if(DATA[k])DATA[k].overlays=s[k].overlays||DATA[k].overlays})}catch{}
const icons={afektif:'💖',kognitif:'🧠',psikomotorik:'✋'};function saveLocal(){localStorage.setItem('egk_editor_data',JSON.stringify(DATA));$('#status').textContent='✅ Tersimpan. Game otomatis pakai data ini.'}function aData(){return DATA[aspect]}function arr(){return aData().overlays[String(page)]||(aData().overlays[String(page)]=[])}function base(){return {w:aData().baseW||1600,h:aData().baseH||900}}function pct(v,m){return v/m*100+'%'}function imgPath(){return `${aData().folder}/slide_${String(page).padStart(2,'0')}.png`}function setAspect(a){aspect=a;page=1;selected=null;history.replaceState(null,'',`?aspect=${a}`);render()}
function init(){const tabs=$('#aspectTabs');Object.keys(DATA).forEach(k=>{const b=document.createElement('button');b.className='aspect-tab';b.dataset.a=k;b.textContent=`${icons[k]||'⭐'} ${DATA[k].title.replace('Aspek ','')}`;b.onclick=()=>setAspect(k);tabs.appendChild(b)});$('#page').onchange=()=>{page=Math.max(1,Math.min(aData().total,Number($('#page').value)||1));selected=null;render()};$('#prev').onclick=()=>{page=Math.max(1,page-1);selected=null;render()};$('#next').onclick=()=>{page=Math.min(aData().total,page+1);selected=null;render()};document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$('#del').onclick=del;$('#save').onclick=saveLocal; const rb=$('#rapikanDragBtn'); if(rb) rb.onclick=rapikanDragDrop;$('#reset').onclick=()=>{if(confirm('Reset semua edit localStorage?')){localStorage.removeItem('egk_editor_data');location.reload()}};$('#export').onclick=()=>{const blob=new Blob(['const ASPEK_DATA = '+JSON.stringify(DATA,null,2)+';'],{type:'text/javascript'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='data-edited-3-aspek.js';a.click()};$('#applyJson').onclick=()=>{try{aData().overlays[String(page)]=JSON.parse($('#json').value);selected=null;render();saveLocal()}catch(e){alert('JSON belum valid')}};applyTheme();render()}

function getAutoDragPos(n, source){
  const b=base();
  const itemW = Math.max(110, Math.round(b.w*.13));
  const itemH = Math.max(95, Math.round(b.h*.105));
  const startX = Math.round(b.w*.07);
  const startY = Math.round(b.h*.66);
  const gapX = Math.round(b.w*.025);
  const gapY = Math.round(b.h*.025);
  const cols = Math.max(1, Math.floor((b.w - startX*2) / (itemW + gapX)));
  const slot = Math.max(0, Number(n||1)-1);
  const row = Math.floor(slot / cols);
  const col = slot % cols;
  const maxRows = Math.max(1, Math.floor((b.h - startY - itemH - 20) / (itemH + gapY)) + 1);
  const safeRow = row % maxRows;
  const cycle = Math.floor(row / maxRows);
  let x = startX + col * (itemW + gapX) + cycle * 16;
  let y = startY + safeRow * (itemH + gapY) + cycle * 12;
  x = Math.max(0, Math.min(b.w - itemW, x));
  y = Math.max(0, Math.min(b.h - itemH, y));
  return {x:Math.round(x), y:Math.round(y), w:itemW, h:itemH};
}
function getAutoDropPos(n){
  const b=base();
  const w=Math.max(150,Math.round(b.w*.18));
  const h=Math.max(90,Math.round(b.h*.11));
  const startX=Math.round(b.w*.10), startY=Math.round(b.h*.14);
  const gapX=Math.round(b.w*.025), gapY=Math.round(b.h*.025);
  const cols=Math.max(1,Math.floor((b.w-startX*2)/(w+gapX)));
  const slot=Math.max(0,Number(n||1)-1);
  const row=Math.floor(slot/cols), col=slot%cols;
  const maxRows=Math.max(1,Math.floor((b.h*.44-startY)/(h+gapY))+1);
  const safeRow=row%maxRows, cycle=Math.floor(row/maxRows);
  let x=startX+col*(w+gapX)+cycle*16;
  let y=startY+safeRow*(h+gapY)+cycle*12;
  x=Math.max(0,Math.min(b.w-w,x));
  y=Math.max(0,Math.min(b.h-h,y));
  return {x:Math.round(x),y:Math.round(y),w,h};
}
function rapikanDragDrop(){
  let c=0;
  arr().forEach(o=>{
    if(o.type!=='dragdrop')return;
    const b=base();
    (o.args[0]||[]).forEach((it,i)=>{
      const outside = Number(it.x||0)<0 || Number(it.y||0)<0 || Number(it.x||0)>b.w-10 || Number(it.y||0)>b.h-10;
      if(outside){ Object.assign(it,getAutoDragPos(i+1,it.source||'slide')); c++; }
    });
    (o.args[1]||[]).forEach((d,i)=>{
      const outside = Number(d.x||0)<0 || Number(d.y||0)<0 || Number(d.x||0)>b.w-10 || Number(d.y||0)>b.h-10;
      if(outside){ Object.assign(d,getAutoDropPos(i+1)); c++; }
    });
  });

function bindHotDrag(el,o,key,kind='',idx=0){

      const dx=(ev.clientX-sx)/rect.width*b.w,dy=(ev.clientY-sy)/rect.height*b.h;
      move(o,start,dx,dy,kind,idx);
      applyLiveStyle(el,o,kind,idx);

<script id="egk-export-assets-real-js">
(function(){
  function collectDataUrls(obj, found){
    if(!obj || typeof obj !== 'object') return;
    if(typeof obj.src === 'string' && obj.src.startsWith('data:image')){
      found.push({item:obj, key:'src', dataUrl:obj.src});
    }
    if(typeof obj.dataUrl === 'string' && obj.dataUrl.startsWith('data:image')){
      found.push({item:obj, key:'dataUrl', dataUrl:obj.dataUrl});
    }
    if(Array.isArray(obj)){
      obj.forEach(v=>collectDataUrls(v, found));
    } else {
      Object.keys(obj).forEach(k=>collectDataUrls(obj[k], found));
    }
  }

  function dataUrlToBlob(dataUrl){
    const parts = dataUrl.split(',');
    const meta = parts[0] || '';
    const mime = (meta.match(/data:([^;]+)/)||[])[1] || 'image/png';
    const bin = atob(parts[1] || '');
    const arr = new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
    return new Blob([arr], {type:mime});
  }

  function extFromDataUrl(dataUrl){
    const mime = ((dataUrl.match(/^data:([^;]+)/)||[])[1] || 'image/png').toLowerCase();
    if(mime.includes('jpeg') || mime.includes('jpg')) return 'jpg';
    if(mime.includes('webp')) return 'webp';
    if(mime.includes('gif')) return 'gif';
    if(mime.includes('svg')) return 'svg';
    return 'png';
  }

  function getMainDataObject(){
    // editor.html pakai variable lokal bernama DATA, bukan window.HOTSPOTS.
    // Jadi ambil DATA aktif editor dulu.
    try { if (typeof DATA !== 'undefined' && DATA) return DATA; } catch(e) {}
    try { if (window.DATA) return window.DATA; } catch(e) {}
    try { if (window.ASPEK_DATA) return window.ASPEK_DATA; } catch(e) {}
    try { if (typeof ASPEK_DATA !== 'undefined' && ASPEK_DATA) return ASPEK_DATA; } catch(e) {}
    try { if (window.HOTSPOTS) return window.HOTSPOTS; } catch(e) {}
    try { if (window.hotspots) return window.hotspots; } catch(e) {}
    try { if (window.slidesData) return window.slidesData; } catch(e) {}
    return null;
  }

  function makeDataJs(data){
    // Format sesuai file data.js project ini.
    return 'const ASPEK_DATA = ' + JSON.stringify(data, null, 2) + ';';
  }

  async function ensureJSZip(){
    if(window.JSZip) return window.JSZip;
    await new Promise((resolve, reject)=>{
      const s=document.createElement('script');
      s.src='https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js';
      s.onload=resolve;
      s.onerror=reject;
      document.head.appendChild(s);
    });
    return window.JSZip;
  }

  window.egkExportAssets = async function(){
    try{ if(typeof saveLocal==='function') saveLocal(); }catch(e){}
    const data = getMainDataObject();
    if(!data){
      alert('Data editor tidak ketemu. Reload editor dulu, lalu coba lagi.');
      return;
    }

    const found = [];
    collectDataUrls(data, found);

    if(!found.length){
      alert('Belum ada image local/base64 yang perlu diexport. Kalau drag dari slide, cukup upload folder assets slide asli.');
      return;
    }

    let JSZip;
    try{
      JSZip = await ensureJSZip();
    }catch(e){
      alert('JSZip gagal dimuat. Hubungkan internet atau tambahkan jszip.min.js lokal.');
      return;
    }

    const zip = new JSZip();
    const importedFolder = zip.folder('assets').folder('imported');

    found.forEach((entry, idx)=>{
      const ext = extFromDataUrl(entry.dataUrl);
      const filename = 'img_' + String(idx+1).padStart(3,'0') + '.' + ext;
      importedFolder.file(filename, dataUrlToBlob(entry.dataUrl));
      entry.item[entry.key] = 'assets/imported/' + filename;
      if(entry.key === 'dataUrl') entry.item.src = 'assets/imported/' + filename;
    });

    zip.file('hotspot-data.exported.js', makeDataJs(data));

    const blob = await zip.generateAsync({type:'blob'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'egk-imported-assets.zip';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 1500);

    alert('Export selesai. ZIP berisi assets/imported dan hotspot-data.exported.js. Pakai file exported itu untuk deploy.');
  };

  document.addEventListener('DOMContentLoaded', function(){
    const btn = document.getElementById('exportAssetsBtn');
    if(btn) btn.addEventListener('click', window.egkExportAssets);
  });
})();
</script>
